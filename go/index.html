<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NudoIQ</title>
<script>
(function () {
  // Email links land here: record the opaque recipient id (no personal data), then continue to the email landing page.
  // Route by campaign (2026-10-02): c=cold-dispatch -> /dispatch/ (dispatcher page); every other email campaign -> /m/
  // (carrier email page; it handles both phone and computer itself). /get/ is the ads page only.
  // ?view=desktop|mobile is passed through so the device override can be tested end to end.
  var q = new URLSearchParams(location.search), rid = (q.get("rid") || "").slice(0, 32), v = (q.get("v") || "").slice(0, 8);
  var c = q.get("c") || "census", view = q.get("view");
  var dest = (c === "cold-dispatch" ? "/dispatch/" : "/m/") + "?utm_source=outreach&utm_medium=email&utm_campaign=" + encodeURIComponent(c) + "&utm_content=variant-" + encodeURIComponent(v)
    + (view === "desktop" || view === "mobile" ? "&view=" + view : "");
  // A/B 2026-10-06 (Caleb: find reach that converts): /m/ got 21 sessions in 3 days at ~32% scroll, so half of the DESKTOP
  // carrier clicks skip the landing page and open the Chrome Web Store listing directly. Arm = parity of a hash of rid (stable per
  // recipient; recomputable offline from outreach_clicks). Phones always keep /m/ (an extension can't install on a phone; /m/ has the
  // send-to-my-computer bridge). Dispatch keeps /dispatch/. Store installs are split by utm_campaign "<c>-direct" in the CWS dashboard.
  var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || view === "mobile";
  var h = 0; for (var i = 0; i < rid.length; i++) { h = (h * 31 + rid.charCodeAt(i)) >>> 0; }
  if (c !== "cold-dispatch" && !mobile && view !== "desktop-m" && rid.length >= 6 && h % 2 === 1) {
    dest = "https://chromewebstore.google.com/detail/nudoiq/bjilnjgfdndecmamphkkcpplfmniocgk?utm_source=outreach&utm_medium=email&utm_campaign="
      + encodeURIComponent(c + "-direct") + "&utm_content=variant-" + encodeURIComponent(v);
  }
  var done = false, go = function () { if (!done) { done = true; location.replace(dest); } };
  setTimeout(go, 1200);
  if (rid.length < 6) { go(); return; }
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4eXV6c2h1ZGZxZ3RtcWVuaXBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNTY1MzQsImV4cCI6MjA5MzgzMjUzNH0.Gc8UJdtwNFN1n8yNUE3Brs44KWkAe6deUHq0ysKhYdM";
  fetch("https://rxyuzshudfqgtmqenipi.supabase.co/rest/v1/outreach_clicks", { method: "POST", keepalive: true,
    headers: { "Content-Type": "application/json", "apikey": KEY, "Authorization": "Bearer " + KEY, "Prefer": "return=minimal" },
    body: JSON.stringify({ rid: rid, variant: v }) }).then(go, go);
})();
</script><noscript><meta http-equiv="refresh" content="0;url=/"></noscript></head><body></body></html>
