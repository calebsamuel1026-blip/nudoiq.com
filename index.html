<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NudoIQ — Trusted by 450+ Amazon Relay carriers</title>
  <meta name="description" content="The smartest tool for Amazon Relay carriers. Book better loads, track your drivers, run your fleet — all from your browser.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --relay:        #067D62;
      --relay-dark:   #045a47;
      --relay-light:  #e6f4f0;
      --relay-soft:   #f3faf8;
      --ink:          #0c1411;
      --ink-2:        #2a3633;
      --muted:        #6b7872;
      --line:         #e4e9e7;
      --line-2:       #eef1ef;
      --bg:           #fbfcfb;
      --white:        #ffffff;
      --amber:        #f59e0b;
      --shadow-sm:    0 1px 2px rgba(12,20,17,0.04), 0 1px 1px rgba(12,20,17,0.02);
      --shadow-md:    0 8px 24px -8px rgba(12,20,17,0.12), 0 2px 6px rgba(12,20,17,0.04);
      --shadow-lg:    0 24px 48px -16px rgba(6,125,98,0.18), 0 8px 16px -8px rgba(12,20,17,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      overflow-x: hidden;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

    /* ──────────── NAV ──────────── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(251,252,251,0.85);
      backdrop-filter: saturate(140%) blur(14px);
      -webkit-backdrop-filter: saturate(140%) blur(14px);
      border-bottom: 1px solid var(--line-2);
    }
    .nav-inner {
      max-width: 1180px; margin: 0 auto;
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      display: flex; align-items: center; gap: 9px;
      font-weight: 800; font-size: 19px; letter-spacing: -0.02em;
    }
    .logo-mark {
      width: 26px; height: 26px; border-radius: 8px;
      background: var(--relay);
      display: grid; place-items: center;
      position: relative;
      box-shadow: 0 4px 10px -2px rgba(6,125,98,0.4);
    }
    .logo-mark::before {
      content: ''; position: absolute;
      inset: 6px; border: 2px solid white; border-radius: 50%;
      border-right-color: transparent; border-bottom-color: transparent;
      transform: rotate(-45deg);
    }
    .logo-mark::after {
      content: ''; position: absolute;
      width: 4px; height: 4px; background: white; border-radius: 50%;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    .logo-text { color: var(--ink); }
    .logo-text span { color: var(--relay); }

    .nav-links {
      display: flex; gap: 32px;
      font-size: 14.5px; font-weight: 500; color: var(--ink-2);
    }
    .nav-links a:hover { color: var(--relay); }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .nav-signin { font-size: 14.5px; font-weight: 500; color: var(--ink-2); }
    .nav-signin:hover { color: var(--ink); }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: 999px;
      font-size: 14.5px; font-weight: 600;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--relay); color: white;
      box-shadow: 0 4px 12px -2px rgba(6,125,98,0.35);
    }
    .btn-primary:hover { background: var(--relay-dark); transform: translateY(-1px); box-shadow: 0 6px 16px -2px rgba(6,125,98,0.45); }
    .btn-ghost {
      background: transparent; color: var(--ink-2);
      border: 1px solid var(--line);
    }
    .btn-ghost:hover { border-color: var(--ink-2); color: var(--ink); }
    .btn-lg {
      padding: 15px 28px; font-size: 16px; font-weight: 700;
      letter-spacing: -0.01em;
    }
    .nav-burger { display: none; }

    /* ──────────── HERO ──────────── */
    .hero {
      position: relative;
      padding: 80px 0 60px;
      text-align: center;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(6,125,98,0.08), transparent 70%),
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(6,125,98,0.04), transparent 70%);
      pointer-events: none; z-index: 0;
    }
    .hero::after {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(6,125,98,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6,125,98,0.04) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 80%);
      pointer-events: none; z-index: 0;
    }
    .hero-inner { position: relative; z-index: 1; }

    .proof-pill {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 6px 14px 6px 6px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: var(--shadow-sm);
      font-size: 13px; font-weight: 500; color: var(--ink-2);
      margin-bottom: 32px;
    }
    .proof-pill .avatars { display: flex; }
    .proof-pill .avatars span {
      width: 22px; height: 22px; border-radius: 50%;
      background: linear-gradient(135deg, var(--relay), var(--relay-dark));
      border: 2px solid white;
      margin-left: -7px;
      display: grid; place-items: center;
      color: white; font-size: 9px; font-weight: 700;
    }
    .proof-pill .avatars span:first-child { margin-left: 0; }
    .proof-pill .avatars span:nth-child(2) { background: linear-gradient(135deg, #14b8a6, #0f766e); }
    .proof-pill .avatars span:nth-child(3) { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .proof-pill .avatars span:nth-child(4) { background: linear-gradient(135deg, #6366f1, #4338ca); }
    .proof-pill b { color: var(--ink); font-weight: 700; }

    h1.hero-title {
      font-size: clamp(40px, 6.5vw, 78px);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.035em;
      color: var(--ink);
      max-width: 980px;
      margin: 0 auto 24px;
    }
    h1.hero-title .accent {
      color: var(--relay);
      position: relative;
      display: inline-block;
    }
    h1.hero-title .accent::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 6%;
      height: 8px;
      background: rgba(6,125,98,0.18);
      z-index: -1;
      border-radius: 3px;
    }
    h1.hero-title em {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-weight: 400;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .hero-sub {
      font-size: clamp(16px, 1.7vw, 19px);
      color: var(--ink-2);
      max-width: 620px;
      margin: 0 auto 36px;
      line-height: 1.55;
    }
    .hero-sub b { color: var(--ink); font-weight: 600; }

    .hero-ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    .hero-meta {
      margin-top: 18px;
      font-size: 13px; color: var(--muted);
      display: flex; gap: 18px; justify-content: center; flex-wrap: wrap;
    }
    .hero-meta span { display: inline-flex; align-items: center; gap: 6px; }
    .hero-meta svg { width: 14px; height: 14px; color: var(--relay); }

    /* ──────────── SLIDESHOW ──────────── */
    .slideshow {
      position: relative;
      margin: 64px auto 0;
      max-width: 1080px;
    }
    .slideshow-frame {
      border-radius: 16px;
      background: white;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--line);
      overflow: hidden;
      position: relative;
    }
    .slideshow-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px;
      background: #f6f8f7;
      border-bottom: 1px solid var(--line);
      position: relative; z-index: 2;
    }
    .slideshow-bar .dots { display: flex; gap: 6px; }
    .slideshow-bar .dots i {
      width: 11px; height: 11px; border-radius: 50%; display: block;
      background: #d4dad7;
    }
    .slideshow-bar .dots i:nth-child(1) { background: #ff5f57; }
    .slideshow-bar .dots i:nth-child(2) { background: #febc2e; }
    .slideshow-bar .dots i:nth-child(3) { background: #28c840; }
    .slideshow-bar .url {
      flex: 1; max-width: 360px; margin: 0 auto;
      padding: 4px 14px; border-radius: 6px;
      background: white; border: 1px solid var(--line-2);
      font-size: 12px; color: var(--muted);
      text-align: center;
    }
    .slideshow-bar .url b { color: var(--ink-2); font-weight: 500; }

    .slideshow-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1080 / 520;
      background: #0a2520;
      overflow: hidden;
    }
    .slide {
      position: absolute; inset: 0;
      opacity: 0;
      transition: opacity .8s ease;
      display: flex; align-items: flex-start; justify-content: center;
      background: #fbfcfb;
    }
    .slide.active { opacity: 1; z-index: 1; }
    .slide img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: top center;
    }
    /* slide caption — sits on top of image */
    .slide-caption {
      position: absolute; left: 24px; bottom: 24px;
      z-index: 3;
      background: rgba(12,20,17,0.92);
      backdrop-filter: blur(8px);
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 13px;
      max-width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      transform: translateY(8px);
      opacity: 0;
      transition: opacity .6s ease .3s, transform .6s ease .3s;
    }
    .slide.active .slide-caption { opacity: 1; transform: translateY(0); }
    .slide-caption b {
      display: block;
      font-size: 14px; font-weight: 700;
      color: #5de8b0;
      margin-bottom: 3px;
      letter-spacing: -0.01em;
    }

    /* slide dots */
    .slide-dots {
      display: flex; justify-content: center; gap: 8px;
      margin-top: 22px;
    }
    .slide-dots button {
      width: 32px; height: 6px;
      border-radius: 99px;
      background: var(--line);
      transition: background .25s ease, width .25s ease;
    }
    .slide-dots button.active {
      background: var(--relay);
      width: 48px;
    }

    /* slide nav arrows */
    .slide-arrow {
      position: absolute; top: 50%;
      transform: translateY(-50%);
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: var(--shadow-md);
      display: grid; place-items: center;
      z-index: 4;
      transition: background .15s ease, transform .15s ease;
    }
    .slide-arrow:hover { background: white; transform: translateY(-50%) scale(1.05); }
    .slide-arrow.prev { left: 16px; }
    .slide-arrow.next { right: 16px; }
    .slide-arrow svg { width: 18px; height: 18px; color: var(--ink); }

    /* logos strip */
    .logos {
      padding: 56px 0 24px;
      text-align: center;
      border-top: 1px solid var(--line-2);
      margin-top: 64px;
    }
    .logos-label {
      font-size: 12px; font-weight: 600; letter-spacing: 0.12em;
      color: var(--muted); text-transform: uppercase;
      margin-bottom: 28px;
    }
    .logos-row {
      display: flex; justify-content: center; align-items: center;
      gap: clamp(20px, 5vw, 56px); flex-wrap: wrap;
      opacity: 0.62;
    }
    .logos-row .lg {
      font-weight: 700; font-size: 18px; color: var(--ink-2);
      letter-spacing: -0.02em;
    }

    /* ──────────── SECTIONS ──────────── */
    section.block { padding: 100px 0; position: relative; }

    .eyebrow {
      display: inline-block;
      padding: 5px 12px;
      background: var(--relay-light);
      color: var(--relay-dark);
      border-radius: 999px;
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 18px;
    }
    .h2 {
      font-size: clamp(32px, 4.5vw, 52px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      max-width: 720px;
      margin-bottom: 18px;
    }
    .h2 em {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-weight: 400;
      color: var(--relay);
    }
    .h2-sub {
      font-size: 18px; color: var(--ink-2);
      max-width: 580px; line-height: 1.55;
      margin-bottom: 56px;
    }
    .section-head { text-align: center; }
    .section-head .h2,
    .section-head .h2-sub { margin-left: auto; margin-right: auto; }

    /* ──────────── BIG FEATURE BLOCKS ──────────── */
    .bigfeat {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 64px;
      align-items: center;
      margin-bottom: 120px;
    }
    .bigfeat:nth-child(even) { grid-template-columns: 1.1fr 1fr; }
    .bigfeat:nth-child(even) .bigfeat-text { order: 2; }
    .bigfeat:nth-child(even) .bigfeat-visual { order: 1; }
    .bigfeat:last-child { margin-bottom: 0; }

    .bigfeat-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      background: var(--relay-light);
      color: var(--relay-dark);
      border-radius: 999px;
      font-size: 11.5px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      margin-bottom: 14px;
    }
    .bigfeat-tag .pulse {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--relay);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(6,125,98,0.5); }
      50% { box-shadow: 0 0 0 6px rgba(6,125,98,0); }
    }
    .bigfeat h3 {
      font-size: clamp(26px, 3.2vw, 38px);
      font-weight: 800; letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 16px;
    }
    .bigfeat h3 em {
      font-family: 'Instrument Serif', serif;
      font-style: italic; font-weight: 400;
      color: var(--relay);
    }
    .bigfeat p {
      font-size: 17px; color: var(--ink-2);
      line-height: 1.55; margin-bottom: 22px;
      max-width: 480px;
    }
    .bigfeat ul {
      list-style: none;
    }
    .bigfeat ul li {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 7px 0;
      font-size: 15px; color: var(--ink);
    }
    .bigfeat ul li svg {
      width: 18px; height: 18px;
      color: var(--relay);
      flex-shrink: 0; margin-top: 2px;
    }

    /* Visual: device frame for screenshots */
    .device {
      border-radius: 14px;
      background: white;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      position: relative;
    }
    .device-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      background: #f6f8f7;
      border-bottom: 1px solid var(--line-2);
    }
    .device-bar i {
      width: 9px; height: 9px; border-radius: 50%; display: block;
      background: #d4dad7;
    }
    .device-bar i:nth-child(1) { background: #ff5f57; }
    .device-bar i:nth-child(2) { background: #febc2e; }
    .device-bar i:nth-child(3) { background: #28c840; }
    .device img {
      width: 100%;
      display: block;
    }

    /* ──────────── ALERT VISUAL (with sound) ──────────── */
    .alert-visual {
      position: relative;
      background: linear-gradient(135deg, var(--relay-soft), #ecf6f2);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 36px;
      min-height: 360px;
    }
    .alert-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      box-shadow: var(--shadow-md);
      display: flex; gap: 16px;
      align-items: flex-start;
      max-width: 440px;
      margin: 0 auto;
      position: relative;
    }
    .alert-card::before {
      content: '';
      position: absolute;
      top: -3px; left: 20px; right: 20px;
      height: 3px; background: var(--relay);
      border-radius: 0 0 4px 4px;
    }
    .alert-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--relay);
      color: white;
      display: grid; place-items: center;
      flex-shrink: 0;
      position: relative;
    }
    .alert-icon::after {
      content: '';
      position: absolute; inset: -4px;
      border-radius: 14px;
      border: 2px solid var(--relay);
      opacity: 0.4;
      animation: ring 2s infinite;
    }
    @keyframes ring {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .alert-icon svg { width: 22px; height: 22px; }
    .alert-body { flex: 1; }
    .alert-body h5 {
      font-size: 13px; font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .alert-body .price {
      font-size: 22px; font-weight: 800;
      color: var(--ink); letter-spacing: -0.02em;
      margin-bottom: 3px;
    }
    .alert-body .lane {
      font-size: 13px; color: var(--ink-2);
      margin-bottom: 10px;
    }
    .alert-actions { display: flex; gap: 8px; }
    .alert-actions .b {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px; font-weight: 700;
    }
    .alert-actions .b.book { background: var(--relay); color: white; }
    .alert-actions .b.dis  { background: var(--line-2); color: var(--ink-2); }

    .sound-wave {
      display: flex; align-items: center; gap: 3px;
      margin-top: 24px; justify-content: center;
    }
    .sound-wave i {
      width: 3px;
      background: var(--relay);
      border-radius: 2px;
      animation: wave 1.2s ease-in-out infinite;
    }
    .sound-wave i:nth-child(1) { height: 14px; animation-delay: 0.0s; }
    .sound-wave i:nth-child(2) { height: 22px; animation-delay: 0.1s; }
    .sound-wave i:nth-child(3) { height: 32px; animation-delay: 0.2s; }
    .sound-wave i:nth-child(4) { height: 26px; animation-delay: 0.3s; }
    .sound-wave i:nth-child(5) { height: 18px; animation-delay: 0.4s; }
    .sound-wave i:nth-child(6) { height: 28px; animation-delay: 0.5s; }
    .sound-wave i:nth-child(7) { height: 14px; animation-delay: 0.6s; }
    .sound-wave i:nth-child(8) { height: 20px; animation-delay: 0.7s; }
    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }
    .sound-label {
      text-align: center;
      font-size: 12px; font-weight: 600;
      color: var(--muted);
      margin-top: 12px;
      letter-spacing: 0.04em;
    }

    /* ──────────── AUTOBOOK VISUAL ──────────── */
    .autobook-visual {
      background: var(--ink);
      border-radius: 18px;
      padding: 36px;
      color: white;
      position: relative;
      overflow: hidden;
    }
    .autobook-visual::before {
      content: ''; position: absolute;
      width: 260px; height: 260px;
      top: -60px; right: -80px;
      background: radial-gradient(circle, rgba(6,125,98,0.45), transparent 70%);
      pointer-events: none;
    }
    .ab-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
      position: relative;
    }
    .ab-head h5 {
      font-size: 14px; font-weight: 700;
      letter-spacing: 0.06em;
      color: #5de8b0; text-transform: uppercase;
    }
    .ab-head .live {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,0.6);
    }
    .ab-head .live .ld {
      width: 6px; height: 6px; border-radius: 50%;
      background: #5de8b0;
      box-shadow: 0 0 0 0 #5de8b0;
      animation: pulseDark 1.6s infinite;
    }
    @keyframes pulseDark {
      0%, 100% { box-shadow: 0 0 0 0 rgba(93,232,176,0.6); }
      50% { box-shadow: 0 0 0 6px rgba(93,232,176,0); }
    }
    .ab-counter {
      display: flex; align-items: baseline; gap: 6px;
      margin-bottom: 6px;
      position: relative;
    }
    .ab-counter .num {
      font-size: 80px; font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(180deg, white 50%, rgba(93,232,176,0.7));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .ab-counter .of {
      font-size: 22px; color: rgba(255,255,255,0.5); font-weight: 600;
    }
    .ab-counter .lab {
      font-size: 13px; color: rgba(255,255,255,0.6);
      margin-bottom: 12px;
    }
    .ab-progress {
      height: 8px; border-radius: 99px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      margin: 14px 0 24px;
      position: relative;
    }
    .ab-progress i {
      display: block; height: 100%;
      width: 70%;
      background: linear-gradient(90deg, var(--relay), #5de8b0);
      border-radius: 99px;
      position: relative;
    }
    .ab-rules {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      position: relative;
    }
    .ab-rule {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .ab-rule .k {
      font-size: 11px; color: rgba(255,255,255,0.5);
      letter-spacing: 0.04em; text-transform: uppercase;
      margin-bottom: 4px;
    }
    .ab-rule .v {
      font-size: 15px; font-weight: 700; color: white;
    }
    .ab-rule .v.green { color: #5de8b0; }
    .ab-bookings {
      margin-top: 20px;
      position: relative;
    }
    .ab-bookings h6 {
      font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.06em; text-transform: uppercase;
      margin-bottom: 10px;
    }
    .ab-row {
      display: grid; grid-template-columns: auto 1fr auto auto;
      gap: 10px; align-items: center;
      padding: 8px 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 7px;
      margin-bottom: 6px;

    }

    }

    .ab-row .ln { color: rgba(255,255,255,0.9); font-weight: 500; }
    .ab-row .py { color: #5de8b0; font-weight: 700; font-variant-numeric: tabular-nums; }
    .ab-row .tm { color: rgba(255,255,255,0.4); font-size: 10px; font-variant-numeric: tabular-nums; }

    /* ──────────── SMALL FEATURES GRID ──────────── */
    .small-feats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 80px;
    }
    .sfeat {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 26px;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .sfeat:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: #d8e0dd; }
    .sfeat .ic-wrap {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--relay-light);
      color: var(--relay-dark);
      display: grid; place-items: center;
      margin-bottom: 14px;
    }
    .sfeat .ic-wrap svg { width: 20px; height: 20px; }
    .sfeat h4 {
      font-size: 17px; font-weight: 700;
      letter-spacing: -0.02em; margin-bottom: 6px;
    }
    .sfeat p { font-size: 14.5px; color: var(--ink-2); line-height: 1.55; }

    /* ──────────── STORY ──────────── */
    .story {
      background: linear-gradient(180deg, white, var(--relay-soft));
      border-top: 1px solid var(--line-2);
      border-bottom: 1px solid var(--line-2);
    }
    .story-grid {
      display: grid; grid-template-columns: 1.1fr 1fr;
      gap: 64px; align-items: center;
    }
    .story-grid .quote-mark {
      font-family: 'Instrument Serif', serif;
      font-size: 120px; line-height: 0.8;
      color: var(--relay);
      margin-bottom: 8px;

    }
    .story-grid blockquote {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.25;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 28px;
    }
    .story-grid blockquote em {
      font-style: italic;
      color: var(--relay-dark);
    }
    .story-grid cite {
      display: flex; align-items: center; gap: 14px;
      font-style: normal;
    }
    .story-grid cite .av {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, var(--relay), var(--relay-dark));
      color: white; font-weight: 700; font-size: 17px;
      display: grid; place-items: center;
    }
    .story-grid cite b { display: block; font-size: 15px; }
    .story-grid cite span { font-size: 13px; color: var(--muted); }

    .stats-card {
      background: var(--ink);
      color: white;
      border-radius: 24px;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }
    .stats-card::before {
      content: ''; position: absolute;
      width: 240px; height: 240px;
      background: radial-gradient(circle, rgba(6,125,98,0.45), transparent 70%);
      top: -60px; right: -60px;
      pointer-events: none;
    }
    .stats-card h4 {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 22px;
      font-weight: 400;
      margin-bottom: 28px;
      color: rgba(255,255,255,0.9);
    }
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
    }
    .stat-block .n {
      font-size: 44px; font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      color: white;
      margin-bottom: 6px;
    }
    .stat-block .n .unit { font-size: 22px; color: rgba(255,255,255,0.6); margin-left: 2px; }
    .stat-block .l { font-size: 13px; color: rgba(255,255,255,0.6); }

    /* testimonials */
    .testis {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 20px; margin-top: 60px;
    }
    .testi {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .testi:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .testi .stars {
      color: var(--amber); margin-bottom: 12px;
      letter-spacing: 1px; font-size: 14px;
    }
    .testi p {
      font-size: 15px; color: var(--ink-2); line-height: 1.55;
      margin-bottom: 18px;
    }
    .testi cite {
      display: flex; align-items: center; gap: 12px; font-style: normal;
    }
    .testi cite .av {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #4338ca);
      color: white; font-weight: 700; font-size: 13px;
      display: grid; place-items: center;
    }
    .testi:nth-child(2) cite .av { background: linear-gradient(135deg, var(--relay), var(--relay-dark)); }
    .testi:nth-child(3) cite .av { background: linear-gradient(135deg, var(--amber), #d97706); }
    .testi cite b { display: block; font-size: 14px; }
    .testi cite span { font-size: 12px; color: var(--muted); }

    /* ──────────── PRICING ──────────── */
    .pricing-wrap { display: flex; justify-content: center; }
    .price-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 40px;
      max-width: 540px; width: 100%;
      box-shadow: var(--shadow-md);
      position: relative;
    }
    .price-card .ribbon {
      position: absolute; top: -14px; left: 50%;
      transform: translateX(-50%);
      background: var(--ink); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
      padding: 6px 14px; border-radius: 999px;
    }
    .price-name {
      font-size: 14px; font-weight: 600; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--relay-dark);
      margin-bottom: 16px;
    }
    .price-amount {
      display: flex; align-items: baseline; gap: 6px;
      margin-bottom: 6px;
    }
    .price-amount .d { font-size: 28px; font-weight: 700; color: var(--ink-2); }
    .price-amount .n {
      font-size: 64px; font-weight: 800;
      letter-spacing: -0.04em; color: var(--ink);
      line-height: 1;
    }
    .price-amount .p { font-size: 16px; color: var(--muted); }
    .price-desc { font-size: 15px; color: var(--ink-2); margin-bottom: 28px; }
    .price-list { list-style: none; margin-bottom: 28px; }
    .price-list li {
      display: flex; align-items: flex-start; gap: 11px;
      padding: 9px 0;
      font-size: 15px; color: var(--ink);
    }
    .price-list li svg {
      width: 18px; height: 18px;
      color: var(--relay);
      flex-shrink: 0; margin-top: 2px;
    }
    .price-cta { display: block; text-align: center; padding: 16px; }
    .price-foot {
      margin-top: 14px;
      font-size: 13px; color: var(--muted);
      text-align: center;
    }

    /* ──────────── FAQ ──────────── */
    .faqs { max-width: 760px; margin: 0 auto; }
    details.faq {
      border-bottom: 1px solid var(--line);
      padding: 22px 0;
    }
    details.faq summary {
      list-style: none;
      cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 17px; font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    details.faq summary::-webkit-details-marker { display: none; }
    details.faq summary .icon {
      width: 24px; height: 24px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: grid; place-items: center;
      transition: transform .2s ease, background .2s ease, color .2s ease;
      flex-shrink: 0; margin-left: 16px;
    }
    details.faq[open] summary .icon {
      transform: rotate(45deg);
      background: var(--relay); color: white; border-color: var(--relay);
    }
    details.faq summary .icon svg { width: 12px; height: 12px; }
    details.faq p {
      margin-top: 14px;
      font-size: 15.5px; color: var(--ink-2); line-height: 1.6;
      max-width: 92%;
    }

    /* ──────────── FINAL CTA ──────────── */
    .final-cta {
      text-align: center;
      background: linear-gradient(135deg, var(--ink) 0%, #0d2820 100%);
      border-radius: 24px;
      padding: 80px 40px;
      color: white;
      position: relative;
      overflow: hidden;
      margin: 0 24px;
    }
    .final-cta::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 60% at 50% 0%, rgba(6,125,98,0.35), transparent 60%),
        radial-gradient(ellipse 40% 40% at 80% 100%, rgba(6,125,98,0.2), transparent 60%);
      pointer-events: none;
    }
    .final-cta-inner { position: relative; max-width: 720px; margin: 0 auto; }
    .final-cta h2 {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 800; letter-spacing: -0.03em;
      line-height: 1.05; margin-bottom: 18px;
    }
    .final-cta h2 em {
      font-family: 'Instrument Serif', serif; font-style: italic;
      color: #5de8b0; font-weight: 400;
    }
    .final-cta p {
      font-size: 18px; color: rgba(255,255,255,0.7);
      max-width: 480px; margin: 0 auto 36px; line-height: 1.5;
    }
    .final-cta .btn-primary { background: white; color: var(--ink); }
    .final-cta .btn-primary:hover { background: #f5f7f6; }

    /* ──────────── FOOTER ──────────── */
    <footer>
      <div class="foot-inner">
        <div class="foot-logo">
          <a href="#" class="logo">
            <span class="logo-mark"></span>
            <span class="logo-text">Nudo<span>IQ</span></span>
          </a>
          <p>The smartest tool for Amazon Relay carriers. Built by carriers, for carriers.</p>
        </div>
        <div class="foot-cols">
          <div class="foot-col">
            <h5>Product</h5>
            <a href="#features">Features</a>
            <a href="#pricing">Pricing</a>
            <a href="#faq">FAQ</a>
          </div>
          <div class="foot-col">
            <h5>Company</h5>
            <a href="#story">Our story</a>
            <a href="mailto:contact@nudoiq.com">Contact</a>
            <a href="https://t.me/nudoiqsupport">Telegram</a>
          </div>
          <div class="foot-col">
            <h5>Legal</h5>
            <a href="#">Privacy policy</a>
            <a href="#">Terms of service</a>
          </div>
        </div>
      </div>
      <div class="foot-bottom">
        <div>© 2026 NudoIQ. All rights reserved.</div>
        <div>Not affiliated with or endorsed by Amazon.com, Inc.</div>
      </div>
    </footer>

    /* ──────────── DEMO MODAL ──────────── */
    <div class="modal" id="demoModal" onclick="if(event.target===this)closeDemo()">
      <div class="modal-card">
        <button class="modal-close" onclick="closeDemo()" aria-label="Close">×</button>
        <div class="aspect" id="demoAspect">
          Demo video coming soon — paste your Loom or YouTube embed URL into <code>DEMO_EMBED_URL</code> in the page script.
        </div>
      </div>
    </div>

  <script>
    // ── Demo modal ─────────────────────────
    const DEMO_EMBED_URL = ""; // ← paste your YouTube/Loom embed URL here, e.g. "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"
    const modal = document.getElementById('demoModal');
    const aspect = document.getElementById('demoAspect');
    const originalAspectHTML = aspect.innerHTML;
    function openDemo() {
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
      if (DEMO_EMBED_URL) {
        aspect.innerHTML = `<iframe src="${DEMO_EMBED_URL}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
      }
    }
    function closeDemo() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
      aspect.innerHTML = originalAspectHTML;
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDemo(); });

    // ── Smooth nav offset ──────────────────
    document.querySelectorAll('a[href^="#"]').forEach(a => {
      a.addEventListener('click', e => {
        const id = a.getAttribute('href').slice(1);
        if (!id) return;
        const el = document.getElementById(id);
        if (el) { e.preventDefault(); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      });
    });

    // ── Slideshow ──────────────────────────
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('#slideDots button');
    let currentSlide = 0;
    let slideInterval;

    function showSlide(n) {
      currentSlide = (n + slides.length) % slides.length;
      slides.forEach((s, i) => s.classList.toggle('active', i === currentSlide));
      dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    }
    function slideNext() { showSlide(currentSlide + 1); resetInterval(); }
    function slidePrev() { showSlide(currentSlide - 1); resetInterval(); }
    function goToSlide(n) { showSlide(n); resetInterval(); }
    function resetInterval() {
      clearInterval(slideInterval);
      slideInterval = setInterval(() => showSlide(currentSlide + 1), 5000);
    }
    slideInterval = setInterval(() => showSlide(currentSlide + 1), 5000);

    // expose for inline onclick handlers
    window.slideNext = slideNext;
    window.slidePrev = slidePrev;
    window.goToSlide = goToSlide;
    window.openDemo = openDemo;
    window.closeDemo = closeDemo;

    // ── Fade-in on scroll ──────────────────
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          en.target.style.opacity = '1';
          en.target.style.transform = 'translateY(0)';
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.bigfeat, .sfeat, .testi, .price-card, .story-grid > div').forEach(el => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(24px)';
      el.style.transition = 'opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1)';
      io.observe(el);
    });
  </script>
